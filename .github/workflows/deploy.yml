name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            git push https://Newuser3301:$HF_TOKEN@huggingface.co/spaces/Newuser3301/wildmind-zoo-classification main
          else
            echo "HF_TOKEN secret not set yet. Skipping sync."
          fi
